{{define "form/inbound"}}
<div class="inbound-form-layout">
    <section class="inbound-form-section">
        <div class="inbound-form-section-head">
            <div class="form-section-icon"><a-icon type="profile"></a-icon></div>
            <div>
                <h3>基础配置</h3>
                <p>确定入站名称、端口、月度限额与到期日期。</p>
            </div>
        </div>
        <a-form class="inbound-base-form" layout="vertical">
            <a-form-item label='{{ i18n "remark" }}'>
                <a-input id="inbound-remark-input" v-model.trim="dbInbound.remark" placeholder="例如：主节点"
                         aria-label="入站备注"></a-input>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    监听 IP
                    <a-tooltip title="默认留空即可"><a-icon type="question-circle" theme="filled"></a-icon></a-tooltip>
                </span>
                <a-input v-model.trim="inbound.listen" placeholder="留空监听所有 IP"></a-input>
            </a-form-item>
            <a-form-item label="端口" required>
                <a-input id="inbound-port-input" type="number" min="1" max="65535"
                         v-model.number="inbound.port" aria-label="入站端口"></a-input>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    月度流量限额 (GB)
                    <a-tooltip title="0 表示不限制"><a-icon type="question-circle" theme="filled"></a-icon></a-tooltip>
                </span>
                <a-input-number v-model="dbInbound.totalGB" :min="0"></a-input-number>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    到期时间
                    <a-tooltip title="留空则永不到期"><a-icon type="question-circle" theme="filled"></a-icon></a-tooltip>
                </span>
                <a-date-picker format="YYYY-MM-DD"
                               v-model="dbInbound._expiryTime"></a-date-picker>
            </a-form-item>
            <a-form-item label='{{ i18n "enable" }}'>
                <div class="form-switch-row">
                    <a-switch v-model="dbInbound.enable"></a-switch>
                    <span>[[ dbInbound.enable ? '保存后立即启用' : '保存后保持停用' ]]</span>
                </div>
            </a-form-item>
        </a-form>
    </section>

    <section class="inbound-form-section protocol-section">
        <div class="inbound-form-section-head">
            <div class="form-section-icon success"><a-icon type="key"></a-icon></div>
            <div>
                <h3>协议与认证</h3>
                <p>管理 VLESS 用户身份；每位用户均可单独下载配置。</p>
            </div>
        </div>
        <template v-if="inbound.protocol === Protocols.VLESS">{{template "form/vless"}}</template>
    </section>

    <section class="inbound-form-section" v-if="inbound.canEnableStream()">
        <div class="inbound-form-section-head">
            <div class="form-section-icon violet"><a-icon type="deployment-unit"></a-icon></div>
            <div>
                <h3>传输配置</h3>
                <p>选择 TCP、WebSocket、gRPC 等传输方式及其详细参数。</p>
            </div>
        </div>
        <a-alert v-if="inbound.stream.security === 'reality'" type="info" show-icon
                 message="当前入站使用 Reality"
                 description="Reality 传输参数将原样保留；如需调整请使用原始配置工具，以免影响现有用户。"></a-alert>
        <template v-else>{{template "form/streamSettings"}}</template>
    </section>

    <section class="inbound-form-section" v-if="inbound.canEnableTls() || inbound.canSniffing()">
        <div class="inbound-form-section-head">
            <div class="form-section-icon warning"><a-icon type="safety-certificate"></a-icon></div>
            <div>
                <h3>TLS 与高级设置</h3>
                <p>证书和嗅探参数会影响连接兼容性，无特殊需求时保持现有值。</p>
            </div>
        </div>
        <a-alert v-if="inbound.stream.security === 'reality'" type="info" show-icon
                 message="当前入站使用 Reality"
                 description="为确保现有客户端持续可用，Reality 参数将在保存时原样保留。"></a-alert>
        <template v-else-if="inbound.canEnableTls()">{{template "form/tlsSettings"}}</template>
        <template v-if="inbound.canSniffing()">{{template "form/sniffing"}}</template>
    </section>
</div>
{{end}}
