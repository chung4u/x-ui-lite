{{define "form/vless"}}
<div class="vless-user-editor">
    <div class="vless-user-editor-head">
        <span>VLESS 用户</span>
        <a-button type="primary" size="small" icon="user-add" @click="inbound.settings.addVless()">新增用户</a-button>
    </div>
    <div class="vless-user-row" v-for="(user, index) in inbound.settings.vlesses" :key="user.id">
        <a-form layout="inline">
            <a-form-item label="名称">
                <a-input v-model.trim="user.email" placeholder="例如：iPhone"></a-input>
            </a-form-item>
            <a-form-item label="UUID">
                <a-input v-model.trim="user.id"></a-input>
            </a-form-item>
            <a-form-item v-if="inbound.xtls" label="XTLS Flow">
                <a-select v-model="user.flow" style="width: 150px">
                    <a-select-option value="">不使用流控</a-select-option>
                    <a-select-option v-for="key in FLOW_CONTROL" :value="key">[[ key ]]</a-select-option>
                </a-select>
            </a-form-item>
            <a-form-item v-if="inbound.settings.vlesses.length > 1">
                <a-button type="link" icon="delete" @click="inbound.settings.delVless(index)">删除</a-button>
            </a-form-item>
        </a-form>
    </div>
</div>

<a-form layout="inline">
    <a-form-item label="fallbacks">
        <a-row>
            <a-button type="primary" size="small"
                      @click="inbound.settings.addFallback()">
                +
            </a-button>
        </a-row>
    </a-form-item>
</a-form>

<!-- vless fallbacks -->
<a-form v-for="(fallback, index) in inbound.settings.fallbacks" layout="inline">
    <a-divider>
        fallback[[ index + 1 ]]
        <a-icon type="delete" @click="() => inbound.settings.delFallback(index)"
                style="color: rgb(255, 77, 79);cursor: pointer;"/>
    </a-divider>
    <a-form-item label="name">
        <a-input v-model="fallback.name"></a-input>
    </a-form-item>
    <a-form-item label="alpn">
        <a-input v-model="fallback.alpn"></a-input>
    </a-form-item>
    <a-form-item label="path">
        <a-input v-model="fallback.path"></a-input>
    </a-form-item>
    <a-form-item label="dest">
        <a-input v-model="fallback.dest"></a-input>
    </a-form-item>
    <a-form-item label="xver">
        <a-input type="number" v-model.number="fallback.xver"></a-input>
    </a-form-item>
    <a-divider v-if="inbound.settings.fallbacks.length - 1 === index"/>
</a-form>
{{end}}
