{{define "form/streamXHTTP"}}
<a-form layout="vertical" class="xhttp-settings-grid">
    <a-form-item label="请求路径">
        <a-input v-model.trim="inbound.stream.xhttp.path" :disabled="dbInbound.isManagedExternal" placeholder="/connect/…"></a-input>
    </a-form-item>
    <a-form-item label="Host">
        <a-input v-model.trim="inbound.stream.xhttp.host" :disabled="dbInbound.isManagedExternal" placeholder="留空使用入口域名"></a-input>
    </a-form-item>
    <a-form-item label="服务端模式">
        <a-select v-model="inbound.stream.xhttp.mode" :disabled="dbInbound.isManagedExternal">
            <a-select-option value="auto">自动</a-select-option>
            <a-select-option value="stream-up">stream-up</a-select-option>
            <a-select-option value="stream-one">stream-one</a-select-option>
            <a-select-option value="packet-up">packet-up</a-select-option>
        </a-select>
    </a-form-item>
</a-form>
{{end}}
