{{define "inboundModal"}}
<a-modal id="inbound-modal" :visible="inModal.visible" :title="inModal.title"
         :closable="true" :mask-closable="false" :keyboard="false" :width="880"
         wrap-class-name="inbound-modal-wrap" @cancel="inModal.requestClose">
    <a-alert v-if="validationError" class="inbound-validation-alert" type="error" show-icon
             message="无法保存当前配置" :description="validationError"></a-alert>
    <div class="inbound-change-summary" v-if="changeSummary.length > 0">
        <a-icon type="edit"></a-icon>
        <span>本次将变更：[[ changeSummary.join('、') ]]</span>
    </div>
    {{template "form/inbound"}}
    <template slot="footer">
        <span class="modal-shortcut-hint">⌘ / Ctrl + Enter 保存</span>
        <a-button @click="inModal.requestClose">{{ i18n "close" }}</a-button>
        <a-button type="primary" :loading="inModal.confirmLoading" @click="inModal.ok">
            [[ inModal.okText ]]
        </a-button>
    </template>
</a-modal>
<script>

    const realitySiteOptions = Object.freeze([
        {value: 'apple', label: 'Apple', serverName: 'www.apple.com', dest: 'www.apple.com:443'},
        {value: 'cloudflare', label: 'Cloudflare', serverName: 'www.cloudflare.com', dest: 'www.cloudflare.com:443'},
        {value: 'speedtest', label: 'Speedtest', serverName: 'www.speedtest.net', dest: 'www.speedtest.net:443'},
        {value: 'nvidia', label: 'NVIDIA', serverName: 'www.nvidia.com', dest: 'www.nvidia.com:443'},
        {value: 'amazon', label: 'Amazon', serverName: 'www.amazon.com', dest: 'www.amazon.com:443'},
    ]);

    const defaultRealitySite = realitySiteOptions[0];

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        editingId: 0,
        usedPorts: [],
        baseline: '',
        validationError: '',
        realityPublicKey: '',
        realityKeyLoading: false,
        realityShortIDLoading: false,
        ensureRealitySettings() {
            const stream = this.inbound.stream;
            if (!stream.reality || typeof stream.reality !== 'object') {
                stream.reality = {
                    show: false,
                    dest: defaultRealitySite.dest,
                    xver: 0,
                    serverNames: [defaultRealitySite.serverName],
                    privateKey: '',
                    minClientVer: '',
                    maxClientVer: '',
                    maxTimeDiff: 0,
                    shortIds: [''],
                    clientFingerprint: 'chrome',
                };
            }
            if (!Array.isArray(stream.reality.serverNames) || stream.reality.serverNames.length === 0) {
                Vue.set(stream.reality, 'serverNames', ['']);
            }
            if (!Array.isArray(stream.reality.shortIds) || stream.reality.shortIds.length === 0) {
                Vue.set(stream.reality, 'shortIds', ['']);
            }
            if (!stream.reality.clientFingerprint) {
                Vue.set(stream.reality, 'clientFingerprint', 'chrome');
            }
            return stream.reality;
        },
        applyRealitySite(site) {
            if (!site) return;
            const reality = this.ensureRealitySettings();
            Vue.set(reality, 'serverNames', [site.serverName]);
            Vue.set(reality, 'dest', site.dest);
        },
        currentState() {
            return {
                base: {
                    remark: this.dbInbound.remark,
                    enable: this.dbInbound.enable,
                    total: this.dbInbound.total,
                    expiryTime: this.dbInbound.expiryTime,
                    listen: this.inbound.listen,
                    port: this.inbound.port,
                    protocol: this.inbound.protocol,
                },
                protocol: this.inbound.settings.toString(),
                stream: this.inbound.stream.toString(),
                sniffing: this.inbound.canSniffing() ? this.inbound.sniffing.toString() : '{}',
            };
        },
        stateSignature() {
            return JSON.stringify(this.currentState());
        },
        isDirty() {
            return this.visible && this.baseline !== this.stateSignature();
        },
        changeSummary() {
            if (!this.baseline) {
                return [];
            }
            const before = JSON.parse(this.baseline);
            const after = this.currentState();
            const changes = [];
            if (JSON.stringify(before.base) !== JSON.stringify(after.base)) changes.push('基础配置');
            if (before.protocol !== after.protocol) changes.push('协议与认证');
            if (before.stream !== after.stream) changes.push('传输与 TLS');
            if (before.sniffing !== after.sniffing) changes.push('高级设置');
            return changes;
        },
        validate() {
            const port = Number(this.inbound.port);
            if (!Number.isInteger(port) || port < 1 || port > 65535) {
                return '端口必须是 1–65535 之间的整数。';
            }
            if (this.usedPorts.includes(port)) {
                return `端口 ${port} 已被其他入站使用，请更换端口。`;
            }
            if (ObjectUtil.isEmpty(this.inbound.protocol)) {
                return '请选择入站协议。';
            }
            if (!Number.isFinite(Number(this.dbInbound.totalGB)) || Number(this.dbInbound.totalGB) < 0) {
                return '月度流量限额不能小于 0。';
            }
            if (this.inbound.stream.security === 'reality') {
                const reality = this.inbound.stream.reality || {};
                const serverName = Array.isArray(reality.serverNames) ? String(reality.serverNames[0] || '').trim() : '';
                const shortID = Array.isArray(reality.shortIds) ? String(reality.shortIds[0] || '').trim() : '';
                const isPresetSite = realitySiteOptions.some(site => site.serverName === serverName && site.dest === String(reality.dest || '').trim());
                if (!isPresetSite) return '请选择预设的 REALITY 伪装站点。';
                if (!String(reality.privateKey || '').trim()) return '请生成或填写 REALITY 私钥。';
                if (shortID && !/^[0-9a-fA-F]{1,16}$/.test(shortID)) return 'Short ID 需为 1–16 位十六进制字符。';
            }
            return '';
        },
        normalizeRealityShortID() {
            if (this.inbound.stream.security !== 'reality') return;
            const reality = this.inbound.stream.reality || {};
            const shortID = Array.isArray(reality.shortIds) ? String(reality.shortIds[0] || '').trim() : '';
            Vue.set(reality, 'shortIds', shortID ? [shortID] : []);
        },
        ok() {
            inModal.validationError = inModal.validate();
            if (inModal.validationError) {
                window.setTimeout(() => {
                    const portInput = document.querySelector('#inbound-port-input');
                    if (portInput) portInput.focus();
                });
                return;
            }
            inModal.normalizeRealityShortID();
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, editingId=0, usedPorts=[], confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (this.inbound.stream.security === 'reality') {
                this.ensureRealitySettings();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.editingId = editingId;
            this.usedPorts = usedPorts.map(port => Number(port));
            this.confirm = confirm;
            this.validationError = '';
            this.realityPublicKey = '';
            this.realityKeyLoading = false;
            this.realityShortIDLoading = false;
            this.visible = true;
            this.baseline = this.stateSignature();
            window.setTimeout(() => {
                const remarkInput = document.querySelector('#inbound-remark-input');
                if (remarkInput) remarkInput.focus();
            }, 120);
        },
        close() {
            this.visible = false;
            this.loading(false);
            this.validationError = '';
            this.baseline = '';
            this.realityPublicKey = '';
            this.realityKeyLoading = false;
            this.realityShortIDLoading = false;
        },
        requestClose() {
            if (!inModal.isDirty()) {
                inModal.close();
                return;
            }
            Vue.prototype.$confirm({
                title: '放弃未保存的更改？',
                content: '当前入站配置已修改，关闭后这些更改不会保留。',
                okText: '放弃更改',
                okType: 'danger',
                cancelText: '继续编辑',
                onOk: () => inModal.close(),
            });
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = { VLESS: Protocols.VLESS };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            realitySiteOptions,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            }
        },
        computed: {
            validationError() {
                return inModal.validationError;
            },
            changeSummary() {
                return inModal.changeSummary();
            },
            realitySettings() {
                return inModal.inbound.stream.reality || {};
            },
            selectedRealitySite: {
                get() {
                    const reality = this.realitySettings;
                    const serverName = Array.isArray(reality.serverNames) ? String(reality.serverNames[0] || '').trim() : '';
                    const dest = String(reality.dest || '').trim();
                    const site = realitySiteOptions.find(option => option.serverName === serverName && option.dest === dest);
                    return site ? site.value : undefined;
                },
                set(value) {
                    const site = realitySiteOptions.find(option => option.value === value);
                    inModal.applyRealitySite(site);
                },
            },
            realityFlow: {
                get() {
                    const users = inModal.inbound.settings && inModal.inbound.settings.vlesses;
                    return users && users[0] ? users[0].flow : '';
                },
                set(value) {
                    const users = inModal.inbound.settings && inModal.inbound.settings.vlesses;
                    if (!Array.isArray(users)) return;
                    users.forEach(user => { user.flow = value; });
                },
            },
        },
        methods: {
            streamNetworkChange(oldValue) {
                if (oldValue === 'kcp') {
                    this.inModal.inbound.tls = false;
                }
            },
            ensureRealitySettings() {
                return inModal.ensureRealitySettings();
            },
            securityModeChange(mode) {
                const stream = this.inModal.inbound.stream;
                if (mode === 'reality') {
                    this.ensureRealitySettings();
                    stream.network = 'tcp';
                }
                stream.security = mode;
            },
            async getRealityKey(privateKey = '') {
                this.inModal.realityKeyLoading = true;
                try {
                    const msg = await HttpUtil.post('/xui/inbound/realityKey', {privateKey});
                    if (!msg.success) return null;
                    this.inModal.realityPublicKey = msg.obj.publicKey || '';
                    return msg.obj;
                } finally {
                    this.inModal.realityKeyLoading = false;
                }
            },
            async generateRealityKey() {
                const pair = await this.getRealityKey();
                if (!pair) return;
                this.ensureRealitySettings().privateKey = pair.privateKey;
                this.$message.success('已生成 REALITY 密钥对');
            },
            async deriveRealityPublicKey() {
                const reality = this.ensureRealitySettings();
                const pair = await this.getRealityKey(reality.privateKey);
                if (!pair) return;
                this.$message.success('已更新客户端公钥');
            },
            async generateRealityShortID() {
                this.inModal.realityShortIDLoading = true;
                try {
                    const msg = await HttpUtil.post('/xui/inbound/realityShortID');
                    if (!msg.success || !msg.obj || !msg.obj.shortId) return;
                    Vue.set(this.ensureRealitySettings(), 'shortIds', [msg.obj.shortId]);
                    this.$message.success('已生成 Short ID');
                } finally {
                    this.inModal.realityShortIDLoading = false;
                }
            }
        },
        mounted() {
            this.beforeUnloadHandler = event => {
                if (!inModal.isDirty()) {
                    return;
                }
                event.preventDefault();
                event.returnValue = '';
            };
            window.addEventListener('beforeunload', this.beforeUnloadHandler);
            this.keydownHandler = event => {
                if (!inModal.visible || inModal.confirmLoading) return;
                if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                    event.preventDefault();
                    inModal.ok();
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    inModal.requestClose();
                }
            };
            document.addEventListener('keydown', this.keydownHandler);
        },
        beforeDestroy() {
            window.removeEventListener('beforeunload', this.beforeUnloadHandler);
            document.removeEventListener('keydown', this.keydownHandler);
        }
    });

</script>
{{end}}
