name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e TARGET_ARCH \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            golang:1.22-bullseye \
            bash -ceu '
              apt-get update -y
              apt-get install -y --no-install-recommends ca-certificates curl unzip gcc
              if [[ "$TARGET_ARCH" == "arm64" ]]; then
                apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
                export CC=aarch64-linux-gnu-gcc
              fi
              mkdir -p package/bin
              CGO_ENABLED=1 GOOS=linux GOARCH="$TARGET_ARCH" go build -buildvcs=false -trimpath -o package/x-ui .
              case "$TARGET_ARCH" in
                amd64)
                  XRAY_ASSET="Xray-linux-64.zip"
                  XRAY_SHA256="b3e5902d06d6282fe53cfa2fc426058b9aeaa429b2c812e20887cd47f26d08bf"
                  ;;
                arm64)
                  XRAY_ASSET="Xray-linux-arm64-v8a.zip"
                  XRAY_SHA256="13a251379bea366c2cf10363ad71e75734193d401f26f518bf0c25e5c8f8c931"
                  ;;
              esac
              curl --fail --silent --show-error --location --retry 3 \
                "https://github.com/XTLS/Xray-core/releases/download/v26.6.27/${XRAY_ASSET}" \
                -o "/tmp/${XRAY_ASSET}"
              echo "${XRAY_SHA256}  /tmp/${XRAY_ASSET}" | sha256sum --check --status
              unzip -p "/tmp/${XRAY_ASSET}" xray > "package/bin/xray-linux-${TARGET_ARCH}"
              chmod 0755 "package/bin/xray-linux-${TARGET_ARCH}"
              cp bin/geoip.dat bin/geosite.dat package/bin/
              cp x-ui.service x-ui.sh scripts/install.sh package/
              tar -czf "x-ui-linux-${TARGET_ARCH}.tar.gz" -C package .
            '
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" release-assets/x-ui-linux-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "X-UI Lite $TAG_NAME" \
            --generate-notes
