name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            xray_asset: Xray-linux-64.zip
            xray_sha256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
          - arch: arm64
            runner: ubuntu-24.04-arm
            xray_asset: Xray-linux-arm64-v8a.zip
            xray_sha256: 64ed6858982a7f5eb85d88b811089063bd4f17561f4c8f44e0f1dc8e6f6430be
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          XRAY_ASSET: ${{ matrix.xray_asset }}
          XRAY_SHA256: ${{ matrix.xray_sha256 }}
        run: |
          set -euo pipefail
          XRAY_ZIP="$RUNNER_TEMP/$XRAY_ASSET"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/${XRAY_ASSET}" \
            -o "$XRAY_ZIP"
          printf '%s  %s\n' "$XRAY_SHA256" "$XRAY_ZIP" | sha256sum --check
          mkdir -p package/bin
          unzip -p "$XRAY_ZIP" xray > "package/bin/xray-linux-$TARGET_ARCH"
          chmod 0755 "package/bin/xray-linux-$TARGET_ARCH"
          cp bin/geoip.dat bin/geosite.dat package/bin/
          cp x-ui.service x-ui.sh scripts/install.sh package/
          docker run --rm \
            -e TARGET_ARCH \
            -e RELEASE_TAG \
            -e GOTOOLCHAIN=go1.27.3 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            golang:1.22-bullseye \
            bash -ceu '
              test "$(go env GOARCH)" = "$TARGET_ARCH"
              go test -mod=readonly -buildvcs=false -trimpath ./...
              go build -mod=readonly -buildvcs=false -trimpath -o package/x-ui .
              cd package
              test "$(./x-ui -v)" = "${RELEASE_TAG#v}"
              test_dir="$(mktemp -d)"
              export XUI_DB_PATH="$test_dir/x-ui.db"
              printf "%s" "release-smoke-password" | ./x-ui setting -username smoke-admin -password-stdin
              ./x-ui check
            '
          tar -czf "x-ui-linux-$TARGET_ARCH.tar.gz" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$TAG_NAME" > "$notes_file"
          test -s "$notes_file"
          gh release create "$TAG_NAME" release-assets/x-ui-linux-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "X-UI Lite $TAG_NAME" \
            --verify-tag \
            --latest \
            --notes-file "$notes_file"
